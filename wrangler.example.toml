# Solo para pruebas en local. En Cloudflare Pages las conexiones (DB, FOTOS) se eligen en Settings → Bindings.
name = "entre-causas"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "entrecausas"
database_id = "LOCAL"

[[kv_namespaces]]
binding = "FOTOS"
id = "LOCAL"
