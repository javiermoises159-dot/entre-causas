<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entre Causas · Menù</title>
<meta name="theme-color" content="#0E0C0A">
<meta name="description" content="Menù di Entre Causas · Peruvian Kitchen, Napoli">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0C0A;--bg2:#17130F;--card:#1C1712;--line:#2E261E;--tx:#F4EDE3;--mut:#A99C8C;--aji:#F2B705;--rojo:#C8372D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 Poppins,system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:20;background:rgba(14,12,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));max-width:720px;margin:0 auto}
.bar img{height:38px;filter:invert(1)}
.lang{position:relative}
.lang>button{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 13px Poppins,sans-serif}
.lang>button svg{width:16px;height:16px;stroke:var(--aji)}
.lmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:160px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.lmenu.on{display:block}
.lmenu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--tx);padding:12px 16px;font:500 15px Poppins,sans-serif;text-align:left}
.lmenu button.sel{color:var(--aji);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;max-width:720px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;color:var(--mut);text-decoration:none;font:500 13px Poppins,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.tabs a.on{color:#1A1206;background:var(--aji);border-color:var(--aji)}
.hero{max-width:720px;margin:0 auto;padding:28px 20px 6px;text-align:center}
.hero h1{font:700 26px/1.15 Cinzel,serif;letter-spacing:.06em}
.hero p{color:var(--mut);font-size:13px;margin-top:6px;letter-spacing:.12em;text-transform:uppercase}
.hero .orn{width:56px;height:2px;background:var(--aji);margin:14px auto 0;border-radius:2px}
main{max-width:720px;margin:0 auto;padding:0 16px 40px}
section{scroll-margin-top:118px;padding-top:26px}
section h2{font:700 19px Cinzel,serif;letter-spacing:.08em;color:var(--aji);display:flex;align-items:center;gap:12px;margin-bottom:14px}
section h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card .ph{aspect-ratio:4/3;background:#000;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:13px 15px 15px}
.hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hd h3{font:600 16px/1.3 Poppins,sans-serif}
.pr{color:var(--aji);font:600 16px Poppins,sans-serif;white-space:nowrap}
.ds{color:var(--mut);font-size:13.5px;margin-top:5px}
.tag{display:inline-block;margin-top:8px;font:600 11px Poppins,sans-serif;letter-spacing:.04em;color:var(--aji);border:1px solid rgba(242,183,5,.45);border-radius:999px;padding:2px 9px}
.ops{margin-top:7px;font-size:12.5px;color:var(--mut)}
.ops b{color:var(--tx);font-weight:500}
.alg{margin-top:8px;font-size:13px;letter-spacing:2px}
.ago{opacity:.45}
.ago .pr::after{content:attr(data-ago);display:block;font-size:11px;color:var(--rojo);text-align:right;letter-spacing:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 15px}
.row{padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.leg{margin-top:34px;padding:16px;border:1px solid var(--line);border-radius:16px;color:var(--mut);font-size:12.5px}
.leg h4{color:var(--tx);font:600 13px Poppins,sans-serif;margin-bottom:8px}
.leg span{display:inline-block;margin:0 12px 6px 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 16px 30px}
.load{text-align:center;color:var(--mut);padding:60px 0}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <img src="logo-claro.png" alt="Entre Causas · Peruvian Kitchen">
    <div class="lang"><button id="lb" onclick="tg(event)" aria-label="Lingua / Idioma / Language"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="ll"></span></button>
      <div class="lmenu" id="lm"></div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="hero"><h1>Entre Causas</h1><p id="sub"></p><div class="orn"></div></div>
<main id="m"><div class="load">…</div></main>
<footer id="ft"></footer>
<script>
const LG={es:['🇪🇸','Español','ES'],it:['🇮🇹','Italiano','IT'],en:['🇬🇧','English','EN']};
const TX={es:{sub:'Cocina peruana · Nápoles',alg:'Alérgenos',algTx:'Si tienes alguna alergia o intolerancia, avisa a nuestro personal.',ago:'Agotado',err:'No se pudo cargar la carta. Recarga la página.',ft:'Precios en euros, IVA incluido'},
 it:{sub:'Cucina peruviana · Napoli',alg:'Allergeni',algTx:'Per allergie o intolleranze, chiedi al nostro personale.',ago:'Esaurito',err:'Impossibile caricare il menù. Ricarica la pagina.',ft:'Prezzi in euro, IVA inclusa'},
 en:{sub:'Peruvian kitchen · Naples',alg:'Allergens',algTx:'If you have any allergy or intolerance, please tell our staff.',ago:'Sold out',err:'The menu could not load. Please refresh.',ft:'Prices in euros, VAT included'}};
const ALG={gluten:['🌾','Gluten','Glutine','Gluten'],crustaceos:['🦐','Crustáceos','Crostacei','Crustaceans'],huevo:['🥚','Huevo','Uova','Eggs'],pescado:['🐟','Pescado','Pesce','Fish'],cacahuetes:['🥜','Cacahuetes','Arachidi','Peanuts'],soja:['🫘','Soja','Soia','Soy'],lacteos:['🥛','Lácteos','Latte','Milk'],frutos:['🌰','Frutos de cáscara','Frutta a guscio','Tree nuts'],apio:['🥬','Apio','Sedano','Celery'],mostaza:['🟡','Mostaza','Senape','Mustard'],sesamo:['⚪','Sésamo','Sesamo','Sesame'],sulfitos:['🍷','Sulfitos','Solfiti','Sulphites'],altramuces:['🫛','Altramuces','Lupini','Lupin'],moluscos:['🦪','Moluscos','Molluschi','Molluscs']};
const AI={es:1,it:2,en:3};
let M=null,L='it';
try{L=localStorage.getItem('ed_lang')||''}catch(e){}
if(!LG[L]){const n=(navigator.language||'it').slice(0,2);L=LG[n]?n:'it';}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=(o,k)=>L==='es'?(o[k]||''):(o[k+'_'+L]||o[k]||'');
const eur=n=>{n=Number(n)||0;return (n%1?n.toFixed(2).replace('.',','):String(n))+' €';};
function tg(e){e.stopPropagation();$('lm').classList.toggle('on');}
addEventListener('click',()=>$('lm').classList.remove('on'));
function setL(l){L=l;try{localStorage.setItem('ed_lang',l)}catch(e){}document.documentElement.lang=l;$('lm').classList.remove('on');pintar();}
function ops(it){return (it.opciones||[]).map(o=>{const v=(o.valores||[]).map(x=>esc(loc(x,'nombre'))+(x.precio?` (+${eur(x.precio)})`:'')).join(' · ');return v?`<div class="ops"><b>${esc(loc(o,'nombre'))}:</b> ${v}</div>`:'';}).join('');}
function item(it,conFoto){
  const al=(it.alergenos||[]).filter(a=>ALG[a]).map(a=>`<span title="${esc(ALG[a][AI[L]])}">${ALG[a][0]}</span>`).join('');
  const tag=loc(it,'etiqueta');
  const bd=`<div class="hd"><h3>${esc(loc(it,'nombre'))}</h3><div class="pr" data-ago="${esc(TX[L].ago)}">${eur(it.precio)}</div></div>${loc(it,'desc')?`<div class="ds">${esc(loc(it,'desc'))}</div>`:''}${ops(it)}${tag?`<span class="tag">${esc(tag)}</span>`:''}${al?`<div class="alg">${al}</div>`:''}`;
  const ag=it.agotado?' ago':'';
  return conFoto?`<article class="card${ag}"><div class="ph"><img loading="lazy" src="${esc(it.foto)}" alt="${esc(loc(it,'nombre'))}"></div><div class="bd">${bd}</div></article>`:`<div class="row${ag}">${bd}</div>`;
}
function pintar(){
  const t=TX[L];$('ll').textContent=LG[L][0]+' '+LG[L][2];$('sub').textContent=t.sub;
  $('lm').innerHTML=Object.keys(LG).map(k=>`<button class="${k===L?'sel':''}" onclick="setL('${k}')">${LG[k][0]} ${LG[k][1]}${k===L?' ✓':''}</button>`).join('');
  if(!M){return;}
  const cats=(M.categorias||[]).filter(c=>c.id!=='ofertas').map(c=>({...c,items:(c.items||[]).filter(i=>!i.oculto)})).filter(c=>c.items.length);
  $('tabs').innerHTML=cats.map((c,i)=>`<a href="#c-${esc(c.id)}" class="${i?'':'on'}">${esc(loc(c,'corto')||loc(c,'nombre'))}</a>`).join('');
  $('m').innerHTML=cats.map(c=>{const F=c.items.filter(i=>i.foto),S=c.items.filter(i=>!i.foto);
    return `<section id="c-${esc(c.id)}"><h2>${esc(loc(c,'nombre'))}</h2>${F.length?`<div class="grid">${F.map(i=>item(i,true)).join('')}</div>`:''}${S.length?`<div class="list"${F.length?' style="margin-top:14px"':''}>${S.map(i=>item(i,false)).join('')}</div>`:''}</section>`;}).join('')
   +`<div class="leg"><h4>${esc(t.alg)}</h4>${Object.values(ALG).map(a=>`<span>${a[0]} ${esc(a[AI[L]])}</span>`).join('')}<p style="margin-top:6px">${esc(t.algTx)}</p></div>`;
  $('ft').textContent='Entre Causas · Peruvian Kitchen · '+t.ft;
  spy();
}
let obs=null;
function spy(){if(obs)obs.disconnect();const tabs=[...document.querySelectorAll('.tabs a')];
  obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const id='#'+e.target.id;tabs.forEach(a=>{const on=a.getAttribute('href')===id;a.classList.toggle('on',on);if(on){const T=$('tabs');T.scrollTo({left:a.offsetLeft-T.clientWidth/2+a.clientWidth/2,behavior:'smooth'});}});}});},{rootMargin:'-130px 0px -65% 0px'});
  document.querySelectorAll('main section').forEach(s=>obs.observe(s));}
async function cargar(){let m=null;try{const r=await fetch('/api/menu',{cache:'no-store'});if(r.ok)m=await r.json();}catch(e){}
  if(!m){try{const r=await fetch('menu.json');if(r.ok)m=await r.json();}catch(e){}}
  if(!m){$('m').innerHTML=`<div class="load">${esc(TX[L].err)}</div>`;pintar();return;}
  M=m;pintar();}
document.documentElement.lang=L;pintar();cargar();
</script>
</body>
</html>
